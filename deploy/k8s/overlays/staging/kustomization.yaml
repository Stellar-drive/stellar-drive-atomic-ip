# #1069: Staging environment. Auto-synced by Argo CD on every merge to main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stellar-drive-atomic-ipstaging

resources:
  - ../../base

configMapGenerator:
  - name: stellar-drive-atomic-ipapi-config
    literals:
      - RUST_LOG=info
      - STELLAR_NETWORK=testnet
      - PORT=8080
      - INCIDENT_PROVIDER=none

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: stellar-drive-atomic-ipapi
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

# Updated by .github/workflows/gitops-promote.yml — do not edit by hand.
images:
  - name: ghcr.io/stellar-drive/api-server
    newTag: latest
