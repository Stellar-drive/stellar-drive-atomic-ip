# #1067: Nightly orphaned-data cleanup + compression; weekly report.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-optimization
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: stellar-drive-atomic-ipcost-optimizer
          containers:
            - name: optimize
              image: ghcr.io/stellar-drive/ops-toolbox:latest # aws-cli, psql, jq, zstd
              command: ["bash", "/scripts/cost-optimize.sh", "all"]
              env:
                - { name: RETENTION_DAYS, value: "30" }
                - { name: COMPRESS_AFTER_DAYS, value: "7" }
                - { name: COLD_TIER_AFTER_DAYS, value: "90" }
                - { name: COST_LEDGER, value: "/ledger/cost-ledger.jsonl" }
                - { name: REPORT_OUT, value: "/ledger/cost-report-latest.md" }
                - { name: PUSHGATEWAY_URL, value: "http://prometheus-pushgateway.monitoring:9091" }
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: stellar-drive-atomic-ipapi-secrets, key: DATABASE_URL } }
                - name: ARCHIVE_BUCKET
                  valueFrom: { secretKeyRef: { name: stellar-drive-atomic-ipbackup, key: archive_bucket } }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
              volumeMounts:
                - { name: scripts, mountPath: /scripts }
                - { name: ledger, mountPath: /ledger }
                - { name: audit, mountPath: /var/log/stellar-drive/audit }
          volumes:
            - name: scripts
              configMap: { name: stellar-drive-atomic-ipops-scripts, defaultMode: 0555 }
            - name: ledger
              persistentVolumeClaim: { claimName: stellar-drive-atomic-ipcost-ledger }
            - name: audit
              persistentVolumeClaim: { claimName: stellar-drive-atomic-ipaudit-logs }
